name: Verify foundation
on:
  push:
  pull_request:
jobs:
  api-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and tool dependencies
        run: |
          python -m pip install -e './services/api[test]'
          python -m pip install -r requirements-tools.txt
      - name: Install local document parsers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - name: Contract, docs and snapshot checks
        run: |
          python scripts/validate_contracts.py
          python scripts/check_docs.py
          python scripts/check_openapi.py
          python -m pytest scripts/test_docs_checker.py -q
          python scripts/test_st024b_gates.py
          python scripts/test_st024c_gates.py
          python scripts/test_web_artifact_provenance.py
          python scripts/test_exam_bank_backup.py
          python scripts/test_st024d_storage.py
      - name: Build Docs as Code site (strict)
        run: |
          python -m pip install zensical
          zensical build --strict
      - name: API tests
        run: |
          cd services/api
          pytest -q
      - name: Database migration smoke
        run: |
          cd services/api
          DATABASE_URL=sqlite+pysqlite:////tmp/shutong-ci.sqlite3 python -m alembic upgrade head
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build front-end from committed source and verify provenance
        run: |
          state=$(mktemp -d "$RUNNER_TEMP/pageboy-c5-web.XXXXXX")
          python scripts/web_artifact_provenance.py build "$PWD" "$state"
          python - "$state" <<'PYVERIFY'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          import web_artifact_provenance as w
          record = json.loads((pathlib.Path(sys.argv[1]) / 'web-provenance.json').read_text())
          assert record['source_git_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert (record['tree_sha256'], record['file_count']) == w.tree(pathlib.Path('apps/web/dist'))
          print('CI_WEB_BUILD_PROVENANCE_OK')
          PYVERIFY
  pg-migration:
    # 全新 PostgreSQL 迁移护栏：0001 按当前模型建基础表，任何指向非基础表的内联外键
    # 都会在此失败（SQLite 容忍悬空 REFERENCES，PG 建表即校验——ST-007 曾被本地 SQLite 全绿掩蔽）。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pageboy_ci
          POSTGRES_PASSWORD: pageboy_ci
          POSTGRES_DB: pageboy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pageboy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -e './services/api[test]'
      - name: Fresh PostgreSQL migration round-trip
        run: |
          cd services/api
          export DATABASE_URL='postgresql+psycopg://pageboy_ci:pageboy_ci@127.0.0.1:5432/pageboy_ci'
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade 0004
          python -m alembic upgrade head
          python -m alembic check
      - name: PostgreSQL practice and revision concurrency gates (no skips)
        shell: bash
        run: |
          set -euo pipefail
          logs=$(mktemp -d "$RUNNER_TEMP/pageboy-pg-concurrency.XXXXXX")
          export PAGEBOY_HOME="$logs/home"
          unset SHUTONG_ENV DATABASE_URL SHUTONG_EXAM_BANK_MANIFEST_SHA256 ST004_TEST_DATABASE_URL ST002_TEST_DATABASE_URL
          python scripts/test_practice_concurrency.py | tee "$logs/practice.log"
          grep -Eq '(^|[[:space:]=])19 passed([[:space:],]|$)' "$logs/practice.log"
          if grep -Eq '[0-9]+ (skipped|failed|errors?|xfailed|xpassed|deselected)' "$logs/practice.log"; then exit 1; fi
          python scripts/test_revision_concurrency.py | tee "$logs/revision.log"
          grep -Eq '(^|[[:space:]=])6 passed([[:space:],]|$)' "$logs/revision.log"
          if grep -Eq '[0-9]+ (skipped|failed|errors?|xfailed|xpassed|deselected)' "$logs/revision.log"; then exit 1; fi
          echo CI_PG_CONCURRENCY_25_PASSED
      - name: API image migration graph under private build umask and non-root UID
        run: |
          umask 077
          context=$(mktemp -d "$RUNNER_TEMP/pageboy-api.XXXXXX")
          revision=$(git rev-parse HEAD)
          python scripts/web_artifact_provenance.py export "$PWD" "$revision" "$context"
          # Independent defense: deliberately recreate the incident mode before Docker COPY.
          chmod 0700 "$context/services/api/alembic/versions"
          docker build --build-arg "SHUTONG_GIT_SHA=$revision" -t pageboy-ci-api:permission-gate -f "$context/infra/Dockerfile.api" "$context"
          image=$(docker image inspect --format '{{.Id}}' pageboy-ci-api:permission-gate)
          python scripts/check_api_image_migrations.py "$PWD" "$image" 10001:10001
          python scripts/check_api_image_migrations.py "$PWD" "$image" 1001:1001
          # Synthetic DB dedicated to this CI job; never production.
          python -c "import psycopg; c=psycopg.connect('postgresql://pageboy_ci:pageboy_ci@127.0.0.1:5432/pageboy_ci', autocommit=True); c.execute('CREATE DATABASE pageboy_ci_image'); c.close()"
          export DATABASE_URL='postgresql+psycopg://pageboy_ci:pageboy_ci@127.0.0.1:5432/pageboy_ci_image'
          migrate() { docker run --rm --pull=never --network host --user 1001:1001 --env SHUTONG_ENV=prod --env PYTHONDONTWRITEBYTECODE=1 --env DATABASE_URL --entrypoint alembic "$image" "$@"; }
          migrate upgrade 0022
          migrate current
          migrate upgrade 0023
          migrate current
          migrate upgrade head
          migrate check
          migrate upgrade head
          echo CI_NONROOT_TCP_MIGRATION_OK
  web-e2e:
    # 用户旅程（Playwright chromium）：双 webServer 自管端口 18765/5173，无需外部服务。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -e './services/api[test]'
      - name: Install local document parsers (J8 scanned-PDF journey)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install front-end
        run: cd apps/web && npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        run: cd apps/web && npx playwright install chromium --with-deps
      - name: Run front-end unit tests (ST-013 rich-text/math renderer)
        run: cd apps/web && npm run test:unit
      - name: Run user journeys
        run: cd apps/web && npx playwright test
        env:
          # Runner 用系统 Python（API 经 pip -e 安装）；本地默认仓库 .venv。
          PY_CMD: python
  web-e2e-webkit:
    # ST-010 iPad（WebKit 仿真）通道：devices['iPad (gen 7)'] 全套 J1–J4/a11y/R1–R3。
    # 与 web-e2e 相同的双 webServer 自管端口（18765/5173）；--with-deps 由 Runner 免密 sudo 装系统库。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -e './services/api[test]'
      - name: Install local document parsers (J8 scanned-PDF journey)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install front-end
        run: cd apps/web && npm ci --no-audit --no-fund
      - name: Install Playwright webkit
        run: cd apps/web && npx playwright install webkit --with-deps
      - name: Run iPad (WebKit) lane
        run: cd apps/web && npm run test:e2e:ipad
        env:
          PY_CMD: python
