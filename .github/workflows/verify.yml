name: Verify foundation
on:
  push:
  pull_request:
jobs:
  api-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and tool dependencies
        run: |
          python -m pip install -e './services/api[test]'
          python -m pip install -r requirements-tools.txt
      - name: Install local document parsers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
      - name: Contract, docs and snapshot checks
        run: |
          python scripts/validate_contracts.py
          python scripts/check_docs.py
          python scripts/check_openapi.py
          python -m pytest scripts/test_docs_checker.py -q
      - name: Build Docs as Code site (strict)
        run: |
          python -m pip install zensical
          zensical build --strict
      - name: API tests
        run: |
          cd services/api
          pytest -q
      - name: Database migration smoke
        run: |
          cd services/api
          DATABASE_URL=sqlite+pysqlite:////tmp/shutong-ci.sqlite3 python -m alembic upgrade head
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install front-end
        run: cd apps/web && npm ci --no-audit --no-fund
      - name: Build front-end
        run: cd apps/web && npm run build
  pg-migration:
    # 全新 PostgreSQL 迁移护栏：0001 按当前模型建基础表，任何指向非基础表的内联外键
    # 都会在此失败（SQLite 容忍悬空 REFERENCES，PG 建表即校验——ST-007 曾被本地 SQLite 全绿掩蔽）。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pageboy_ci
          POSTGRES_PASSWORD: pageboy_ci
          POSTGRES_DB: pageboy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pageboy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -e './services/api[test]'
      - name: Fresh PostgreSQL migration round-trip
        run: |
          cd services/api
          export DATABASE_URL='postgresql+psycopg://pageboy_ci:pageboy_ci@127.0.0.1:5432/pageboy_ci'
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade 0004
          python -m alembic upgrade head
          python -m alembic check
  web-e2e:
    # 用户旅程（Playwright chromium）：双 webServer 自管端口 18765/4173，无需外部服务。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -e './services/api[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install front-end
        run: cd apps/web && npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        run: cd apps/web && npx playwright install chromium --with-deps
      - name: Build front-end
        # vite preview 服务 dist/；CI 各作业文件系统隔离，必须在本作业内构建。
        run: cd apps/web && npm run build
      - name: Run user journeys
        run: cd apps/web && npx playwright test
        env:
          # Runner 用系统 Python（API 经 pip -e 安装）；本地默认仓库 .venv。
          PY_CMD: python
  web-e2e-webkit:
    # ST-010 iPad（WebKit 仿真）通道：devices['iPad (gen 7)'] 全套 J1–J4/a11y/R1–R3。
    # 与 web-e2e 相同的双 webServer 自管端口；--with-deps 由 Runner 免密 sudo 装系统库。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -e './services/api[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install front-end
        run: cd apps/web && npm ci --no-audit --no-fund
      - name: Install Playwright webkit
        run: cd apps/web && npx playwright install webkit --with-deps
      - name: Build front-end
        # vite preview 服务 dist/；CI 各作业文件系统隔离，必须在本作业内构建。
        run: cd apps/web && npm run build
      - name: Run iPad (WebKit) lane
        run: cd apps/web && npm run test:e2e:ipad
        env:
          PY_CMD: python
