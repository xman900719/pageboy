# 本机（无 VPS）ST-OPS-01 部署 override——与 compose.web.yaml（VPS/容器模板）互斥使用：
#   本机：docker compose --env-file .env -f compose.yaml -f compose.local.yaml up -d --build
#   VPS ：docker compose --env-file .env -f compose.yaml -f compose.web.yaml up -d --build
# 差异缘由（2026-10-24 实况，如实）：
#   1. api 端口 8000 被本机无关常驻服务（aegis）占用 → 宿主发布改 127.0.0.1:18000（容器内 8000 不变）。
#   2. db 镜像钉 postgres:16（本机缓存；16-alpine 需拉取，而宿主 docker registry 代理故障）。
#   3. caddy 镜像无法拉取 → Web 入口以宿主二进制运行（infra/.local/caddy + Caddyfile.local，监听 8080），
#      故本文件不含 web 服务，api 反代指向 127.0.0.1:18000。
#   4. cloudflared 使用本机缓存镜像 + host 网络：隧道入站 service=http://localhost:8080 直达宿主 caddy。
services:
  db:
    image: postgres:16
  api:
    ports: !override
      - "127.0.0.1:18000:8000"
    # 本机 bind mount 模式以宿主用户运行：容器写入的 0600 附件文件宿主可直接读取
    # （backup.sh 须 tar 附件）；VPS 模板沿用 Dockerfile 专用 uid + root 卷，不受此影响。
    user: "${SHUTONG_UID:-1000}:${SHUTONG_GID:-1000}"
    environment:
      # ST-017：镜像标签透传进应用，/health/live 的 app_revision 因此可证明"哪个构建在服务"。
      SHUTONG_APP_REVISION: ${SHUTONG_API_TAG:-dev}
      SHUTONG_STANDARDS_DIR: /app/private-data/curriculum_standards
      # Keep the school archive under the existing persistent, backed-up bind mount.
      SHUTONG_SCHOOL_EXAMS_DIR: /var/lib/shutong/attachments/school-exams
    volumes:
      # 附件宿主 bind mount（backup.sh 需在宿主直接 tar）。
      - ${SHUTONG_ATTACHMENTS_DIR:-/media/xc/backup_ext4/pageboy-home/production/data/attachments}:/var/lib/shutong/attachments
      # 官方课标 PDF 原件只读挂载（知识库版本发布 SHA256 强校验门禁依赖）
      - ${SHUTONG_STANDARDS_DIR:-/media/xc/backup_ext4/pageboy-home/production/data/curriculum_standards}:/app/private-data/curriculum_standards:ro
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    # --protocol auto：2026-10-29 曾出现 QUIC 被节流而切为 http2；2026-11-14 实测本机网络
    # HTTP/2(TCP 7844) TLS 握手持续 EOF 而 QUIC(UDP) 通过预检。改为 auto 由 cloudflared
    # 在启动预检时自动选择当前可达的传输协议（QUIC / HTTP2 自适应）。
    command: tunnel --protocol auto --no-autoupdate run --token ${SHUTONG_TUNNEL_TOKEN}
    depends_on:
      - api
