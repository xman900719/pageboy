# 环境隔离：生产项目名固定，避免与开发侧目录名派生的默认项目名（infra）混淆。
name: shutong-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    # ST-017：构建/部署产物按标签命名（deploy.sh 设置；--build 路径默认 dev）。
    image: shutong-api:${SHUTONG_API_TAG:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      SHUTONG_TOKEN: ${SHUTONG_TOKEN:?set SHUTONG_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SHUTONG_ENV: prod
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_files:/var/lib/shutong/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pgdata:
    # 钉死既有卷名：旧项目名 infra 下创建的 infra_pgdata 即生产库，改项目名后必须继续使用它。
    name: infra_pgdata
  private_files:
