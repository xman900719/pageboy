      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              description: 向开发/生产端上传宿主机脱敏 k12100 采集包执行全科补全的请求载荷。
              properties:
                bundle:
                  additionalProperties: true
                  title: Bundle
                  type: object
                confirm_total_scores:
                  default: false
                  title: Confirm Total Scores
                  type: boolean
                exam_keyword:
                  anyOf:
                  - maxLength: 120
                    type: string
                  - type: 'null'
                  title: Exam Keyword
                extract_existing_pdfs:
                  default: true
                  title: Extract Existing Pdfs
                  type: boolean
                max_exams:
                  default: 1
                  maximum: 3
                  minimum: 1
                  title: Max Exams
                  type: integer
                replace_unconfirmed_drafts:
                  default: true
                  title: Replace Unconfirmed Drafts
                  type: boolean
                series_title_prefix:
                  anyOf:
                  - maxLength: 120
                    type: string
                  - type: 'null'
                  title: Series Title Prefix
                target_exam_date:
                  anyOf:
                  - format: date
                    type: string
                  - type: 'null'
                  title: Target Exam Date
                upload_missing_cards:
                  default: true
                  title: Upload Missing Cards
                  type: boolean
                use_ai:
                  default: true
                  title: Use Ai
                  type: boolean
              required:
              - bundle
              title: K12100ImportBundleIn
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
