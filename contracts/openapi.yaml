components:
  schemas:
    AttemptIn:
      properties:
        answer:
          title: Answer
          type: string
        client_attempt_id:
          maxLength: 128
          minLength: 1
          title: Client Attempt Id
          type: string
        exposure_id:
          title: Exposure Id
          type: string
        hints_used:
          default: false
          title: Hints Used
          type: boolean
      required:
      - client_attempt_id
      - exposure_id
      - answer
      title: AttemptIn
      type: object
    GoalIn:
      properties:
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        minutes_per_day:
          maximum: 240.0
          minimum: 5.0
          title: Minutes Per Day
          type: integer
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_points:
          minimum: 0.0
          title: Target Points
          type: number
      required:
      - subject
      - target_points
      - max_points
      - minutes_per_day
      title: GoalIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    QuestionIn:
      properties:
        correct_answer:
          minLength: 1
          title: Correct Answer
          type: string
        kind:
          default: single_choice
          enum:
          - single_choice
          - short_answer
          title: Kind
          type: string
        knowledge_ids:
          items:
            type: string
          minItems: 1
          title: Knowledge Ids
          type: array
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        options:
          items:
            type: string
          title: Options
          type: array
        source_document_id:
          title: Source Document Id
          type: string
        stem:
          minLength: 1
          title: Stem
          type: string
      required:
      - source_document_id
      - stem
      - correct_answer
      - knowledge_ids
      - max_points
      title: QuestionIn
      type: object
    QuestionRevisionOut:
      properties:
        id:
          title: Id
          type: string
        question_id:
          title: Question Id
          type: string
        status:
          const: draft
          title: Status
          type: string
        version:
          minimum: 2.0
          title: Version
          type: integer
      required:
      - id
      - question_id
      - version
      - status
      title: QuestionRevisionOut
      type: object
    SchoolExamIn:
      properties:
        confirmed_by_user:
          default: false
          title: Confirmed By User
          type: boolean
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        exam_date:
          format: date
          title: Exam Date
          type: string
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          minLength: 1
          title: Title
          type: string
      required:
      - subject
      - exam_date
      - title
      - earned_points
      - max_points
      title: SchoolExamIn
      type: object
    SourceIn:
      properties:
        exam_year:
          anyOf:
          - maximum: 2100.0
            minimum: 1990.0
            type: integer
          - type: 'null'
          title: Exam Year
        rights_status:
          default: unknown
          enum:
          - unknown
          - personal_use_reviewed
          - licensed
          title: Rights Status
          type: string
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          maxLength: 256
          minLength: 1
          title: Title
          type: string
        verified:
          default: false
          title: Verified
          type: boolean
      required:
      - title
      - subject
      title: SourceIn
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: 书童 ShuTong API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/admin/questions:
    post:
      operationId: add_question_api_admin_questions_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Question
  /api/admin/questions/{version_id}/publish:
    post:
      operationId: publish_question_api_admin_questions__version_id__publish_post
      parameters:
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Publish Question
  /api/admin/questions/{version_id}/review:
    post:
      operationId: review_question_api_admin_questions__version_id__review_post
      parameters:
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Review Question
  /api/admin/questions/{version_id}/revisions:
    post:
      description: 已发布题的更正只创建草稿，不继承原版审核状态。
      operationId: revise_question_api_admin_questions__version_id__revisions_post
      parameters:
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRevisionOut'
          description: Successful Response
        '401':
          description: Owner authorization required
        '404':
          description: Version not found
        '409':
          description: Unpublished version, changed source, or revision number conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revise Question
  /api/admin/sources:
    post:
      operationId: add_source_api_admin_sources_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Source
  /api/goals:
    post:
      operationId: set_goal_api_goals_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Goal
  /api/guidance/plan:
    get:
      operationId: plan_api_guidance_plan_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Plan
  /api/guidance/profile:
    get:
      operationId: profile_api_guidance_profile_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Profile
  /api/practice/attempts:
    post:
      operationId: submit_attempt_api_practice_attempts_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Submit Attempt
  /api/practice/next:
    get:
      description: A returned question is immediately recorded as exposed. Evaluation
        requires unseen item.
      operationId: next_item_api_practice_next_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: query
        name: purpose
        required: false
        schema:
          default: training
          pattern: ^(training|evaluation)$
          title: Purpose
          type: string
      - in: query
        name: knowledge_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Knowledge Id
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Next Item
  /api/school-exams:
    get:
      operationId: get_school_exams_api_school_exams_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get School Exams
    post:
      operationId: add_school_exam_api_school_exams_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolExamIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add School Exam
  /api/subjects:
    get:
      operationId: subjects_api_subjects_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Subjects
  /health/live:
    get:
      operationId: live_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Live
  /health/ready:
    get:
      operationId: ready_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready
