        name: exam_id
        required: true
        schema:
          title: Exam Id
          type: string
      - in: query
        name: filename
        required: true
        schema:
          maxLength: 255
          minLength: 1
          pattern: ^[^/\\\x00-\x1f\x7f]+$
          title: Filename
          type: string
      - in: query
        name: expected_sha256
        required: false
        schema:
