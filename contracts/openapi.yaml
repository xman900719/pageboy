  /api/admin/knowledge/candidates:
    get:
      description: "返回知识点候选体系与当前审核状态。\n契约权威约束（F01/B01）：\n1. 候选集合固定来源于 contracts/{subject}_knowledge_taxonomy_candidate.json（数学为\
        \ 47 个节点），\n   绝不把旧 24 个历史节点 (math.*) 或契约外节点混入候选列表；\n2. 对已入库的候选节点，如实反映数据库中的真实审核状态、最新版本与实名审核证据；\n\
        3. 未入库的候选节点，按契约展示，标注 pending 与未入库状态；\n4. 单个候选代码仅出现一次，返回列表长度严格为契约候选数量。"
      operationId: list_candidate_nodes_api_admin_knowledge_candidates_get
      parameters:
      - in: query
        name: subject
        required: false
        schema:
          default: math
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Candidate Nodes
  /api/admin/knowledge/candidates/seed:
    post:
      description: "将候选知识体系初始化写入数据库或执行可审计的契约同步修订。\n规则约束（P0-02 / F01 / F02）：\n1. 比对当前契约与\
        \ DB 中的候选节点：\n   - 不在当前契约中的存量候选，安全标记为 status = 'deprecated'，隔离其参与候选发布，但保留历史版本与作答关联；\n\
        \   - 在当前契约中但之前被废弃的节点，重新激活为 status = 'active'；\n2. 对发生 parent_id 变更的候选节点，严格执行学科归属、环路检测和孤儿检查；若检查失败拒绝变更；\n\
        3. 检查已存在候选与当前契约的名称、描述与来源条款差异：\n   - 无差异时保持幂等，不创建重复版本；\n   - 存在差异时，按 F01 版本修订机制生成新版本（version+1），状态重置为\
        \ pending，待重新审核；\n4. 保持幂等性：同一契约重复 seed 不得产生重复版本或非法状态。"
      operationId: seed_candidate_nodes_api_admin_knowledge_candidates_seed_post
      parameters:
      - in: query
        name: subject
        required: false
        schema:
          default: math
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Seed Candidate Nodes
  /api/admin/knowledge/clauses:
    get:
      description: 读取课程标准条款全集数据（支持数学、语文、英语、物理四科）。
      operationId: list_curriculum_clauses_api_admin_knowledge_clauses_get
