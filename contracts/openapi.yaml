              type: string
          audio/mp4:
            schema:
              format: binary
              type: string
          audio/mpeg:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              type: string
          image/png:
            schema:
              format: binary
              type: string
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
