components:
  schemas:
    AttachmentOut:
      properties:
        byte_size:
          exclusiveMinimum: 0.0
          title: Byte Size
          type: integer
        confirmed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Confirmed At
        created_at:
          format: date-time
          title: Created At
          type: string
        extracted_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Extracted Text
        filename:
          title: Filename
          type: string
        id:
          title: Id
          type: string
        media_type:
          enum:
          - application/pdf
          - image/png
          - image/jpeg
          title: Media Type
          type: string
        parsed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Parsed At
        parser_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Parser Version
        question_version_ids:
          items:
            type: string
          title: Question Version Ids
          type: array
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        source_document_id:
          title: Source Document Id
          type: string
        status:
          enum:
          - uploaded
          - parsed
          - needs_manual_input
          - confirmed
          title: Status
          type: string
      required:
      - id
      - source_document_id
      - filename
      - media_type
      - sha256
      - byte_size
      - status
      - extracted_text
      - parser_version
      - parsed_at
      - confirmed_at
      - created_at
      - question_version_ids
      title: AttachmentOut
      type: object
    AttemptIn:
      properties:
        answer:
          title: Answer
          type: string
        client_attempt_id:
          maxLength: 128
          minLength: 1
          title: Client Attempt Id
          type: string
        exposure_id:
          title: Exposure Id
          type: string
        hints_used:
          default: false
          title: Hints Used
          type: boolean
      required:
      - client_attempt_id
      - exposure_id
      - answer
      title: AttemptIn
      type: object
    GoalIn:
      properties:
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        minutes_per_day:
          maximum: 240.0
          minimum: 5.0
          title: Minutes Per Day
          type: integer
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_points:
          minimum: 0.0
          title: Target Points
          type: number
      required:
      - subject
      - target_points
      - max_points
      - minutes_per_day
      title: GoalIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImportConfirmationIn:
      properties:
        confirmed_by_human:
          description: 必须为 true，表示人工核对结构化题目
          title: Confirmed By Human
          type: boolean
        questions:
          items:
            $ref: '#/components/schemas/QuestionIn'
          maxItems: 100
          minItems: 1
          title: Questions
          type: array
      required:
      - confirmed_by_human
      - questions
      title: ImportConfirmationIn
      type: object
    QuestionIn:
      properties:
        correct_answer:
          minLength: 1
          title: Correct Answer
          type: string
        kind:
          default: single_choice
          enum:
          - single_choice
          - short_answer
          title: Kind
          type: string
        knowledge_ids:
          items:
            type: string
          minItems: 1
          title: Knowledge Ids
          type: array
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        options:
          items:
            type: string
          title: Options
          type: array
        source_document_id:
          title: Source Document Id
          type: string
        stem:
          minLength: 1
          title: Stem
          type: string
      required:
      - source_document_id
      - stem
      - correct_answer
      - knowledge_ids
      - max_points
      title: QuestionIn
      type: object
    QuestionRevisionOut:
      properties:
        id:
          title: Id
          type: string
        question_id:
          title: Question Id
          type: string
        status:
          const: draft
          title: Status
          type: string
        version:
          minimum: 2.0
          title: Version
          type: integer
      required:
      - id
      - question_id
      - version
      - status
      title: QuestionRevisionOut
      type: object
    SchoolExamIn:
      properties:
        confirmed_by_user:
          default: false
          title: Confirmed By User
          type: boolean
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        exam_date:
          format: date
          title: Exam Date
          type: string
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          minLength: 1
          title: Title
          type: string
      required:
      - subject
      - exam_date
      - title
      - earned_points
      - max_points
      title: SchoolExamIn
      type: object
    SourceDetailOut:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentOut'
          title: Attachments
          type: array
        id:
          title: Id
          type: string
        reviews:
          items:
            $ref: '#/components/schemas/SourceReviewRecordOut'
          title: Reviews
          type: array
        source:
          $ref: '#/components/schemas/SourceIn'
      required:
      - id
      - source
      - reviews
      - attachments
      title: SourceDetailOut
      type: object
    SourceIn:
      properties:
        exam_year:
          anyOf:
          - maximum: 2100.0
            minimum: 1990.0
            type: integer
          - type: 'null'
          title: Exam Year
        rights_status:
          default: unknown
          enum:
          - unknown
          - personal_use_reviewed
          - licensed
          title: Rights Status
          type: string
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          maxLength: 256
          minLength: 1
          title: Title
          type: string
        verified:
          default: false
          title: Verified
          type: boolean
      required:
      - title
      - subject
      title: SourceIn
      type: object
    SourceReviewIn:
      properties:
        acquired_at:
          format: date
          title: Acquired At
          type: string
        applicability_note:
          maxLength: 2000
          minLength: 1
          title: Applicability Note
          type: string
        applicable:
          title: Applicable
          type: boolean
        exam_year:
          maximum: 2100.0
          minimum: 1990.0
          title: Exam Year
          type: integer
        reviewed_by_human:
          description: 必须为 true，表示人工核查来源与适用性
          title: Reviewed By Human
          type: boolean
        rights_basis:
          maxLength: 2000
          minLength: 1
          title: Rights Basis
          type: string
        rights_status:
          enum:
          - unknown
          - personal_use_reviewed
          - licensed
          title: Rights Status
          type: string
        source_url:
          format: uri
          maxLength: 2083
          minLength: 1
          title: Source Url
          type: string
      required:
      - exam_year
      - source_url
      - acquired_at
      - rights_status
      - rights_basis
      - applicable
      - applicability_note
      - reviewed_by_human
      title: SourceReviewIn
      type: object
    SourceReviewRecordOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        metadata:
          $ref: '#/components/schemas/SourceReviewIn'
        reviewed_by:
          title: Reviewed By
          type: string
      required:
      - id
      - metadata
      - reviewed_by
      - created_at
      title: SourceReviewRecordOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: 书童 ShuTong API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/admin/attachments/{attachment_id}:
    get:
      operationId: get_attachment_api_admin_attachments__attachment_id__get
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Attachment
      tags:
      - private content ingestion
  /api/admin/attachments/{attachment_id}/confirm:
    post:
      operationId: confirm_import_api_admin_attachments__attachment_id__confirm_post
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmationIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Confirm Import
      tags:
      - private content ingestion
  /api/admin/attachments/{attachment_id}/download:
    get:
      operationId: download_attachment_api_admin_attachments__attachment_id__download_get
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Download Attachment
      tags:
      - private content ingestion
  /api/admin/attachments/{attachment_id}/parse:
    post:
      operationId: parse_attachment_api_admin_attachments__attachment_id__parse_post
      parameters:
      - in: path
        name: attachment_id
        required: true
