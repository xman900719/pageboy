    post:
      description: "发布知识库正式版本（强门禁）：\n1. 必须完整包含本次候选体系契约定义的全量候选节点（数学为 47 个 math_cand.*\
        \ 节点）；缺少任一节点拒绝发布。\n2. 旧 math.* 节点只能用于历史兼容，不能独立满足新版发布条件。若无 math_cand.* 候选节点，拒绝发布。\n\
        3. 每个候选节点最新版本必须为 approved，且必须具备完整的人工审核证据（reviewer_id, review_opinion, reviewed_at）；\n\
        \   存在 pending、rejected 或缺乏必要审核证据时，强行拒绝发布。\n4. 节点的来源条款必须有效，不能引用不存在的官方条款。\n\
        5. 成功发布时生成不可变历史快照 snapshot，记录获批节点与权威课标来源版本。"
