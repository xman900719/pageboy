          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Parse Attachment
      tags:
      - private content ingestion
  /api/admin/questions:
    post:
      operationId: add_question_api_admin_questions_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Question
  /api/admin/questions/{version_id}/publish:
    post:
      operationId: publish_question_api_admin_questions__version_id__publish_post
      parameters:
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Publish Question
  /api/admin/questions/{version_id}/review:
    post:
      operationId: review_question_api_admin_questions__version_id__review_post
      parameters:
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Review Question
  /api/admin/questions/{version_id}/revisions:
    post:
      description: 已发布题的更正只创建草稿，不继承原版审核状态。
      operationId: revise_question_api_admin_questions__version_id__revisions_post
      parameters:
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRevisionOut'
          description: Successful Response
        '401':
          description: Owner authorization required
        '404':
          description: Version not found
        '409':
          description: Unpublished version, changed source, or revision number conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revise Question
  /api/admin/sources:
    get:
      operationId: source_ledger_api_admin_sources_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SourceDetailOut'
                title: Response Source Ledger Api Admin Sources Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Source Ledger
      tags:
      - private content ingestion
    post:
      operationId: add_source_api_admin_sources_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Source
  /api/admin/sources/{source_id}:
    get:
      operationId: source_details_api_admin_sources__source_id__get
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDetailOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Source Details
      tags:
      - private content ingestion
  /api/admin/sources/{source_id}/attachments:
    post:
      description: 原始二进制请求体；上限 10 MiB，不使用公开目录或外部下载 URL。
      operationId: upload_attachment_api_admin_sources__source_id__attachments_post
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: query
        name: filename
        required: true
        schema:
          maxLength: 255
          minLength: 1
          pattern: ^[^/\\\x00-\x1f\x7f]+$
          title: Filename
          type: string
      - in: query
        name: expected_sha256
        required: false
        schema:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Expected Sha256
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/pdf:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              type: string
          image/png:
            schema:
              format: binary
              type: string
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upload Attachment
      tags:
      - private content ingestion
  /api/admin/sources/{source_id}/review:
    post:
      operationId: review_source_api_admin_sources__source_id__review_post
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceReviewIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceReviewRecordOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Review Source
      tags:
