          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Goal
  /api/guidance/plan:
    get:
      operationId: plan_api_guidance_plan_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Plan
  /api/guidance/profile:
    get:
      operationId: profile_api_guidance_profile_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Profile
  /api/practice/attempts:
    post:
      operationId: submit_attempt_api_practice_attempts_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Submit Attempt
  /api/practice/next:
    get:
      description: A returned question is immediately recorded as exposed. Evaluation
        requires unseen item.
      operationId: next_item_api_practice_next_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: query
        name: purpose
        required: false
        schema:
          default: training
          pattern: ^(training|evaluation)$
          title: Purpose
          type: string
      - in: query
        name: knowledge_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Knowledge Id
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Next Item
  /api/school-exams:
    get:
      operationId: get_school_exams_api_school_exams_get
      parameters:
      - in: query
        name: subject
        required: true
        schema:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
