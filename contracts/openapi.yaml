components:
  schemas:
    AttachmentOut:
      properties:
        byte_size:
          exclusiveMinimum: 0.0
          title: Byte Size
          type: integer
        confirmed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Confirmed At
        created_at:
          format: date-time
          title: Created At
          type: string
        extracted_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Extracted Text
        filename:
          title: Filename
          type: string
        id:
          title: Id
          type: string
        media_type:
          enum:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - image/png
          - image/jpeg
          - audio/mpeg
          - audio/mp4
          title: Media Type
          type: string
        parsed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Parsed At
        parser_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Parser Version
        question_version_ids:
          items:
            type: string
          title: Question Version Ids
          type: array
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        source_document_id:
          title: Source Document Id
          type: string
        status:
          enum:
          - uploaded
          - parsed
          - needs_manual_input
          - confirmed
          title: Status
          type: string
      required:
      - id
      - source_document_id
      - filename
      - media_type
      - sha256
      - byte_size
      - status
      - extracted_text
      - parser_version
      - parsed_at
      - confirmed_at
      - created_at
      - question_version_ids
      title: AttachmentOut
      type: object
    AttemptIn:
      properties:
        answer:
          title: Answer
          type: string
        client_attempt_id:
          maxLength: 128
          minLength: 1
          title: Client Attempt Id
          type: string
        exposure_id:
          title: Exposure Id
          type: string
        hints_used:
          default: false
          title: Hints Used
          type: boolean
      required:
      - client_attempt_id
      - exposure_id
      - answer
      title: AttemptIn
      type: object
    BatchNodeReviewIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchNodeReviewItem'
          maxItems: 200
          minItems: 1
          title: Items
          type: array
      required:
      - items
      title: BatchNodeReviewIn
      type: object
    BatchNodeReviewItem:
      properties:
        node_id:
          minLength: 1
          title: Node Id
          type: string
        review_opinion:
          minLength: 1
          title: Review Opinion
          type: string
        review_status:
          enum:
          - approved
          - rejected
          title: Review Status
          type: string
        reviewer_id:
          maxLength: 40
          minLength: 1
          title: Reviewer Id
          type: string
      required:
      - node_id
      - reviewer_id
      - review_status
      - review_opinion
      title: BatchNodeReviewItem
      type: object
    DomainRadarItemOut:
      description: 一级知识领域掌握度聚合统计（供成长状态雷达/条形展示）。
      properties:
        domain_code:
          title: Domain Code
          type: string
        domain_name:
          title: Domain Name
          type: string
        insufficient_count:
          title: Insufficient Count
          type: integer
        mastered_count:
          title: Mastered Count
          type: integer
        observed_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Observed Rate
        tested_topics:
          title: Tested Topics
          type: integer
        total_topics:
          title: Total Topics
          type: integer
        untested_count:
          title: Untested Count
          type: integer
        weak_count:
          title: Weak Count
          type: integer
      required:
      - domain_code
      - domain_name
      - total_topics
      - tested_topics
      - mastered_count
      - weak_count
      - insufficient_count
      - untested_count
      title: DomainRadarItemOut
      type: object
    ErratumIn:
      properties:
        note:
          minLength: 1
          title: Note
          type: string
      required:
      - note
      title: ErratumIn
      type: object
    GoalIn:
      properties:
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        minutes_per_day:
          maximum: 240.0
          minimum: 5.0
          title: Minutes Per Day
          type: integer
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_points:
          minimum: 0.0
          title: Target Points
          type: number
      required:
      - subject
      - target_points
      - max_points
      - minutes_per_day
      title: GoalIn
      type: object
    GrowthStatusOut:
      description: 学生成长状态总览：优势、薄弱、领域雷达与当前目标。
      properties:
        current_goal:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Current Goal
        developing:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Developing
          type: array
        disclaimer:
          title: Disclaimer
          type: string
        domain_radar:
          items:
            $ref: '#/components/schemas/DomainRadarItemOut'
          title: Domain Radar
          type: array
        model_version:
          title: Model Version
          type: string
        planning_threshold:
          title: Planning Threshold
          type: number
        recent_wrong_count:
          title: Recent Wrong Count
          type: integer
        release_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Version
        strengths:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Strengths
          type: array
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        summary_counts:
          additionalProperties:
            type: integer
          title: Summary Counts
          type: object
        untested_highlights:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Untested Highlights
          type: array
        weaknesses:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Weaknesses
          type: array
      required:
      - subject
      - model_version
      - planning_threshold
      - summary_counts
      - strengths
      - weaknesses
      - developing
      - untested_highlights
      - domain_radar
      - recent_wrong_count
      - disclaimer
      title: GrowthStatusOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImportConfirmationIn:
      properties:
        confirmed_by_human:
          description: 必须为 true，表示人工核对结构化题目
          title: Confirmed By Human
          type: boolean
        questions:
          items:
            $ref: '#/components/schemas/QuestionIn'
          maxItems: 100
          minItems: 1
          title: Questions
          type: array
      required:
      - confirmed_by_human
      - questions
      title: ImportConfirmationIn
      type: object
    KnowledgeEdgeOut:
      description: 知识图谱关系边（层级隶属或前置依赖）。
      properties:
        edge_type:
          enum:
          - hierarchy
          - prerequisite
          title: Edge Type
          type: string
        relation:
          title: Relation
          type: string
        source:
          title: Source
          type: string
        target:
          title: Target
          type: string
      required:
      - source
      - target
      - relation
      - edge_type
      title: KnowledgeEdgeOut
      type: object
    KnowledgeGraphOut:
      description: 学生端知识图谱：已发布非选学节点、关系边与掌握状态高亮。
      properties:
        edges:
          items:
            $ref: '#/components/schemas/KnowledgeEdgeOut'
          title: Edges
          type: array
        model_version:
          title: Model Version
          type: string
        nodes:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Nodes
          type: array
        release_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Version
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        summary_counts:
          additionalProperties:
            type: integer
          title: Summary Counts
          type: object
      required:
      - subject
      - model_version
      - summary_counts
      - nodes
      - edges
      title: KnowledgeGraphOut
      type: object
    KnowledgeMasteryItemOut:
      description: 单个知识节点的掌握状态与统计信息。
      properties:
        code:
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
        is_leaf:
          title: Is Leaf
          type: boolean
        level:
          title: Level
          type: integer
        mastery_status:
          enum:
          - mastered
          - weak
          - insufficient
          - untested
          title: Mastery Status
          type: string
        name:
          title: Name
          type: string
        observed_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Observed Rate
        parent_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Code
        sample_size:
          title: Sample Size
          type: integer
      required:
      - code
      - name
      - level
      - is_leaf
      - sample_size
      - mastery_status
      title: KnowledgeMasteryItemOut
      type: object
    LinkIn:
      properties:
        evidence:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence
        node_id:
          title: Node Id
          type: string
        question_version_id:
          title: Question Version Id
          type: string
        role:
          default: core
          enum:
          - core
          - aux
          title: Role
          type: string
        sub_index:
          default: 0
          minimum: 0.0
          title: Sub Index
          type: integer
      required:
      - question_version_id
      - node_id
      title: LinkIn
      type: object
    NodeIn:
      properties:
        code:
          maxLength: 80
          minLength: 1
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        origin:
          default: manual
          enum:
          - manual
          - ai_suggested
          title: Origin
          type: string
        parent_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Code
        source_clause_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Source Clause Ids
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      required:
      - subject
      - code
      - name
      title: NodeIn
      type: object
    NodeReviewIn:
      properties:
        review_opinion:
          minLength: 1
          title: Review Opinion
          type: string
        review_status:
          enum:
          - approved
          - rejected
          title: Review Status
          type: string
        reviewer_id:
          maxLength: 40
          minLength: 1
          title: Reviewer Id
          type: string
      required:
      - reviewer_id
      - review_status
      - review_opinion
      title: NodeReviewIn
      type: object
    NodeVersionIn:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        parent_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Code
        source_clause_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Source Clause Ids
      required:
      - name
      title: NodeVersionIn
      type: object
    PracticeQuestionPayloadOut:
      description: 学生端作答题面载荷（严禁包含参考答案）。
      properties:
        exposure_id:
          title: Exposure Id
          type: string
        group_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Context
        kind:
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_titles:
          items:
            type: string
          title: Knowledge Titles
          type: array
        max_points:
          title: Max Points
          type: number
        media_attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Attachment Id
        options:
          items:
            type: string
          title: Options
          type: array
        purpose:
          title: Purpose
          type: string
        question_version_id:
          title: Question Version Id
          type: string
        selection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Selection Reason
        stem:
          title: Stem
          type: string
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        unseen_at_exposure:
          title: Unseen At Exposure
          type: boolean
      required:
      - exposure_id
      - question_version_id
      - purpose
      - unseen_at_exposure
      - stem
      - kind
      - options
      - max_points
      - subject
      title: PracticeQuestionPayloadOut
      type: object
    PracticeSessionCompleteOut:
      description: 练习交卷结算结果与本轮错题清单。
      properties:
        answered_count:
          title: Answered Count
          type: integer
        correct_count:
          title: Correct Count
          type: integer
        session_id:
          title: Session Id
          type: string
        status:
          const: completed
          title: Status
          type: string
        subjective_count:
          title: Subjective Count
          type: integer
        wrong_count:
          title: Wrong Count
          type: integer
        wrong_items:
          items:
            $ref: '#/components/schemas/WrongQuestionSummaryOut'
          title: Wrong Items
          type: array
      required:
      - session_id
      - status
      - answered_count
      - correct_count
      - wrong_count
      - subjective_count
      - wrong_items
      title: PracticeSessionCompleteOut
      type: object
    PracticeSessionCreateIn:
      description: 创建一轮智能综合练习或阶段诊断的请求载荷。
      properties:
        focus_knowledge_code:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Focus Knowledge Code
        purpose:
          default: training
          enum:
          - training
          - evaluation
          title: Purpose
          type: string
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_count:
          default: 5
          maximum: 20.0
          minimum: 1.0
          title: Target Count
          type: integer
      required:
      - subject
      title: PracticeSessionCreateIn
      type: object
    PracticeSessionItemPlanOut:
      description: 练习轮次内单个编排槽位及作答进度。
      properties:
        answered:
          title: Answered
          type: boolean
        attempt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Attempt Id
        earned_points:
          anyOf:
          - type: number
          - type: 'null'
          title: Earned Points
        focus_knowledge_codes:
          items:
            type: string
          title: Focus Knowledge Codes
          type: array
        max_points:
          title: Max Points
          type: number
        question_version_id:
          title: Question Version Id
          type: string
        selection_reason:
          title: Selection Reason
          type: string
        seq:
          title: Seq
          type: integer
      required:
      - seq
      - question_version_id
      - selection_reason
      - focus_knowledge_codes
      - answered
      - max_points
      title: PracticeSessionItemPlanOut
      type: object
    PracticeSessionOut:
      description: 练习会话总览与当前待作答题目。
      properties:
        completed_count:
          title: Completed Count
          type: integer
        composition_summary:
          additionalProperties:
            type: integer
          title: Composition Summary
          type: object
        current_item:
          anyOf:
          - $ref: '#/components/schemas/PracticeQuestionPayloadOut'
          - type: 'null'
        focus_knowledge_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Focus Knowledge Code
        id:
          title: Id
          type: string
        items:
          items:
            $ref: '#/components/schemas/PracticeSessionItemPlanOut'
          title: Items
          type: array
        purpose:
          enum:
          - training
          - evaluation
          title: Purpose
          type: string
        status:
          enum:
          - active
          - in_progress
          - completed
          title: Status
          type: string
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_count:
          title: Target Count
          type: integer
        total_items:
          title: Total Items
          type: integer
      required:
      - id
      - subject
      - purpose
      - status
      - target_count
      - total_items
      - completed_count
      - composition_summary
      - items
      title: PracticeSessionOut
      type: object
    QuestionIn:
      properties:
        correct_answer:
          minLength: 1
          title: Correct Answer
          type: string
        group_context:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Group Context
        kind:
          default: single_choice
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_ids:
          items:
            type: string
          minItems: 1
          title: Knowledge Ids
          type: array
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        media_attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Attachment Id
        options:
          items:
            type: string
          title: Options
          type: array
        source_document_id:
          title: Source Document Id
          type: string
        stem:
          minLength: 1
          title: Stem
          type: string
      required:
      - source_document_id
      - stem
      - correct_answer
      - knowledge_ids
      - max_points
      title: QuestionIn
      type: object
    QuestionRevisionOut:
      properties:
        id:
          title: Id
          type: string
        question_id:
          title: Question Id
          type: string
        status:
          const: draft
          title: Status
          type: string
        version:
          minimum: 2.0
          title: Version
          type: integer
      required:
      - id
      - question_id
      - version
      - status
      title: QuestionRevisionOut
      type: object
    QuestionVersionOut:
      description: 审核台只读回显：某题源下全部版本（含草稿）的内容与状态，仅 owner 授权可见。
      properties:
        correct_answer:
          title: Correct Answer
          type: string
        group_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Context
        id:
          title: Id
          type: string
        kind:
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_ids:
          items:
            type: string
          title: Knowledge Ids
          type: array
        max_points:
          title: Max Points
          type: number
        media_attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Attachment Id
        options:
          items:
            type: string
          title: Options
          type: array
        question_id:
          title: Question Id
          type: string
        reviewed_by_human:
          title: Reviewed By Human
          type: boolean
        status:
          enum:
          - draft
          - reviewed
          - published
          title: Status
          type: string
        stem:
          title: Stem
          type: string
        version:
          title: Version
          type: integer
      required:
      - id
      - question_id
      - version
      - status
      - reviewed_by_human
      - stem
      - kind
      - options
      - correct_answer
      - knowledge_ids
      - max_points
      - group_context
      - media_attachment_id
      title: QuestionVersionOut
      type: object
    RunIn:
      properties:
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_year:
          maximum: 2100.0
          minimum: 2000.0
          title: Target Year
          type: integer
      required:
      - subject
      - target_year
      title: RunIn
      type: object
    SchoolExamIn:
      properties:
        confirmed_by_user:
          default: false
          title: Confirmed By User
          type: boolean
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        exam_date:
          format: date
          title: Exam Date
          type: string
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          minLength: 1
          title: Title
          type: string
      required:
      - subject
      - exam_date
      - title
      - earned_points
      - max_points
      title: SchoolExamIn
      type: object
    SchoolExamItemIn:
      properties:
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        knowledge_id:
          maxLength: 100
          minLength: 1
          title: Knowledge Id
          type: string
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        question_label:
          maxLength: 160
          minLength: 1
          title: Question Label
          type: string
        scoring_origin:
          enum:
          - manual_entry
          - ocr_draft
          title: Scoring Origin
          type: string
      required:
      - question_label
      - knowledge_id
      - earned_points
      - max_points
      - scoring_origin
      title: SchoolExamItemIn
      type: object
    SchoolExamItemsIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SchoolExamItemIn'
          maxItems: 100
          minItems: 1
          title: Items
          type: array
      required:
      - items
      title: SchoolExamItemsIn
      type: object
    SchoolItemConfirmIn:
      properties:
        confirmed_by_human:
          description: 必须为 true，表示人工核对 OCR 草稿分数
          title: Confirmed By Human
          type: boolean
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
      required:
      - confirmed_by_human
      - earned_points
      title: SchoolItemConfirmIn
      type: object
    SelfAssessmentIn:
      properties:
        self_earned_points:
          minimum: 0.0
          title: Self Earned Points
          type: number
      required:
      - self_earned_points
      title: SelfAssessmentIn
      type: object
    SourceDetailOut:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentOut'
          title: Attachments
          type: array
        id:
          title: Id
          type: string
        reviews:
          items:
            $ref: '#/components/schemas/SourceReviewRecordOut'
          title: Reviews
          type: array
        source:
          $ref: '#/components/schemas/SourceIn'
      required:
      - id
      - source
      - reviews
      - attachments
      title: SourceDetailOut
      type: object
    SourceIn:
      properties:
        exam_year:
          anyOf:
