components:
  schemas:
    AttachmentOut:
      properties:
        byte_size:
          exclusiveMinimum: 0.0
          title: Byte Size
          type: integer
        confirmed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Confirmed At
        created_at:
          format: date-time
          title: Created At
          type: string
        extracted_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Extracted Text
        filename:
          title: Filename
          type: string
        id:
          title: Id
          type: string
        media_type:
          enum:
          - application/pdf
          - image/png
          - image/jpeg
          - audio/mpeg
          - audio/mp4
          title: Media Type
          type: string
        parsed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Parsed At
        parser_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Parser Version
        question_version_ids:
          items:
            type: string
          title: Question Version Ids
          type: array
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        source_document_id:
          title: Source Document Id
          type: string
        status:
          enum:
          - uploaded
          - parsed
          - needs_manual_input
          - confirmed
          title: Status
          type: string
      required:
      - id
      - source_document_id
      - filename
      - media_type
      - sha256
      - byte_size
      - status
      - extracted_text
      - parser_version
      - parsed_at
      - confirmed_at
      - created_at
      - question_version_ids
      title: AttachmentOut
      type: object
    AttemptIn:
      properties:
        answer:
          title: Answer
          type: string
        client_attempt_id:
          maxLength: 128
          minLength: 1
          title: Client Attempt Id
          type: string
        exposure_id:
          title: Exposure Id
          type: string
        hints_used:
          default: false
          title: Hints Used
          type: boolean
      required:
      - client_attempt_id
      - exposure_id
      - answer
      title: AttemptIn
      type: object
    ErratumIn:
      properties:
        note:
          minLength: 1
          title: Note
          type: string
      required:
      - note
      title: ErratumIn
      type: object
    GoalIn:
      properties:
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        minutes_per_day:
          maximum: 240.0
          minimum: 5.0
          title: Minutes Per Day
          type: integer
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_points:
          minimum: 0.0
          title: Target Points
          type: number
      required:
      - subject
      - target_points
      - max_points
      - minutes_per_day
      title: GoalIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImportConfirmationIn:
      properties:
        confirmed_by_human:
          description: 必须为 true，表示人工核对结构化题目
          title: Confirmed By Human
          type: boolean
        questions:
          items:
            $ref: '#/components/schemas/QuestionIn'
          maxItems: 100
          minItems: 1
          title: Questions
          type: array
      required:
      - confirmed_by_human
      - questions
      title: ImportConfirmationIn
      type: object
    LinkIn:
      properties:
        evidence:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence
        node_id:
          title: Node Id
          type: string
        question_version_id:
          title: Question Version Id
          type: string
        role:
          default: core
          enum:
          - core
          - aux
          title: Role
          type: string
        sub_index:
          default: 0
          minimum: 0.0
          title: Sub Index
          type: integer
      required:
      - question_version_id
      - node_id
      title: LinkIn
      type: object
    NodeIn:
      properties:
        code:
          maxLength: 80
          minLength: 1
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        origin:
          default: manual
          enum:
          - manual
          - ai_suggested
          title: Origin
          type: string
        parent_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Code
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
      required:
      - subject
      - code
      - name
      title: NodeIn
      type: object
    NodeVersionIn:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: NodeVersionIn
      type: object
    QuestionIn:
      properties:
        correct_answer:
          minLength: 1
          title: Correct Answer
          type: string
        group_context:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Group Context
        kind:
          default: single_choice
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_ids:
          items:
            type: string
          minItems: 1
          title: Knowledge Ids
          type: array
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        media_attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Attachment Id
        options:
          items:
            type: string
          title: Options
          type: array
        source_document_id:
          title: Source Document Id
          type: string
        stem:
          minLength: 1
          title: Stem
          type: string
      required:
      - source_document_id
      - stem
      - correct_answer
      - knowledge_ids
      - max_points
      title: QuestionIn
      type: object
    QuestionRevisionOut:
      properties:
        id:
          title: Id
          type: string
        question_id:
          title: Question Id
          type: string
        status:
          const: draft
          title: Status
          type: string
        version:
          minimum: 2.0
          title: Version
          type: integer
      required:
      - id
      - question_id
      - version
      - status
      title: QuestionRevisionOut
      type: object
    QuestionVersionOut:
      description: 审核台只读回显：某题源下全部版本（含草稿）的内容与状态，仅 owner 授权可见。
      properties:
        correct_answer:
          title: Correct Answer
          type: string
        group_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Context
        id:
          title: Id
          type: string
        kind:
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_ids:
          items:
            type: string
          title: Knowledge Ids
          type: array
        max_points:
          title: Max Points
          type: number
        media_attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Attachment Id
        options:
          items:
            type: string
          title: Options
          type: array
        question_id:
          title: Question Id
          type: string
        reviewed_by_human:
          title: Reviewed By Human
          type: boolean
        status:
          enum:
          - draft
          - reviewed
          - published
          title: Status
          type: string
        stem:
          title: Stem
          type: string
        version:
          title: Version
          type: integer
      required:
      - id
      - question_id
      - version
      - status
      - reviewed_by_human
      - stem
      - kind
      - options
      - correct_answer
      - knowledge_ids
      - max_points
      - group_context
      - media_attachment_id
      title: QuestionVersionOut
      type: object
    RunIn:
      properties:
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_year:
          maximum: 2100.0
          minimum: 2000.0
          title: Target Year
          type: integer
      required:
      - subject
      - target_year
      title: RunIn
      type: object
    SchoolExamIn:
      properties:
        confirmed_by_user:
          default: false
          title: Confirmed By User
          type: boolean
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        exam_date:
          format: date
          title: Exam Date
          type: string
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          minLength: 1
          title: Title
          type: string
      required:
      - subject
      - exam_date
      - title
      - earned_points
      - max_points
      title: SchoolExamIn
      type: object
    SchoolExamItemIn:
      properties:
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        knowledge_id:
          maxLength: 100
          minLength: 1
          title: Knowledge Id
          type: string
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        question_label:
          maxLength: 160
          minLength: 1
          title: Question Label
          type: string
        scoring_origin:
          enum:
          - manual_entry
          - ocr_draft
          title: Scoring Origin
          type: string
      required:
      - question_label
      - knowledge_id
      - earned_points
      - max_points
      - scoring_origin
      title: SchoolExamItemIn
      type: object
    SchoolExamItemsIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SchoolExamItemIn'
          maxItems: 100
          minItems: 1
          title: Items
          type: array
      required:
      - items
      title: SchoolExamItemsIn
      type: object
    SchoolItemConfirmIn:
      properties:
        confirmed_by_human:
          description: 必须为 true，表示人工核对 OCR 草稿分数
          title: Confirmed By Human
          type: boolean
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
      required:
      - confirmed_by_human
      - earned_points
      title: SchoolItemConfirmIn
      type: object
    SelfAssessmentIn:
      properties:
        self_earned_points:
          minimum: 0.0
          title: Self Earned Points
          type: number
      required:
      - self_earned_points
      title: SelfAssessmentIn
      type: object
    SourceDetailOut:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentOut'
          title: Attachments
          type: array
        id:
          title: Id
          type: string
        reviews:
          items:
            $ref: '#/components/schemas/SourceReviewRecordOut'
          title: Reviews
          type: array
        source:
          $ref: '#/components/schemas/SourceIn'
      required:
      - id
      - source
      - reviews
      - attachments
      title: SourceDetailOut
      type: object
    SourceIn:
      properties:
        exam_year:
          anyOf:
          - maximum: 2100.0
            minimum: 1990.0
            type: integer
          - type: 'null'
          title: Exam Year
        paper_key:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          title: Paper Key
        rights_status:
          default: unknown
          enum:
          - unknown
          - personal_use_reviewed
          - licensed
          title: Rights Status
          type: string
        sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Sha256
        source_class:
          default: unclassified
          enum:
          - official_exam
          - aux_book
          - adapted
          - school
          - ai
          - unclassified
          title: Source Class
          type: string
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        title:
          maxLength: 256
          minLength: 1
          title: Title
          type: string
        verified:
          default: false
          title: Verified
          type: boolean
      required:
      - title
      - subject
      title: SourceIn
      type: object
    SourceReviewIn:
      properties:
        acquired_at:
          format: date
          title: Acquired At
          type: string
        applicability_note:
          maxLength: 2000
          minLength: 1
          title: Applicability Note
          type: string
        applicable:
          title: Applicable
          type: boolean
        exam_year:
          maximum: 2100.0
          minimum: 1990.0
          title: Exam Year
          type: integer
        reviewed_by_human:
          description: 必须为 true，表示人工核查来源与适用性
          title: Reviewed By Human
          type: boolean
        rights_basis:
          maxLength: 2000
          minLength: 1
          title: Rights Basis
          type: string
        rights_status:
          enum:
          - unknown
          - personal_use_reviewed
          - licensed
          title: Rights Status
          type: string
        source_url:
          format: uri
          maxLength: 2083
          minLength: 1
          title: Source Url
          type: string
      required:
      - exam_year
      - source_url
      - acquired_at
      - rights_status
      - rights_basis
      - applicable
      - applicability_note
      - reviewed_by_human
      title: SourceReviewIn
      type: object
    SourceReviewRecordOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        metadata:
          $ref: '#/components/schemas/SourceReviewIn'
        reviewed_by:
          title: Reviewed By
          type: string
      required:
      - id
      - metadata
      - reviewed_by
      - created_at
      title: SourceReviewRecordOut
      type: object
    SourceStatusIn:
      properties:
        ingest_status:
          anyOf:
          - enum:
            - recorded
            - ingested
            type: string
          - type: 'null'
          title: Ingest Status
        review_status:
          anyOf:
          - enum:
            - pending
            - approved
            - rejected
            type: string
          - type: 'null'
          title: Review Status
      title: SourceStatusIn
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: 书童 ShuTong API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/admin/attachments/{attachment_id}:
    get:
      operationId: get_attachment_api_admin_attachments__attachment_id__get
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Attachment
      tags:
      - private content ingestion
  /api/admin/attachments/{attachment_id}/confirm:
    post:
      operationId: confirm_import_api_admin_attachments__attachment_id__confirm_post
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmationIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Confirm Import
      tags:
      - private content ingestion
  /api/admin/attachments/{attachment_id}/download:
    get:
      operationId: download_attachment_api_admin_attachments__attachment_id__download_get
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Download Attachment
      tags:
      - private content ingestion
  /api/admin/attachments/{attachment_id}/parse:
    post:
      operationId: parse_attachment_api_admin_attachments__attachment_id__parse_post
      parameters:
      - in: path
        name: attachment_id
        required: true
        schema:
          title: Attachment Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Parse Attachment
      tags:
      - private content ingestion
  /api/admin/coverage:
    get:
      operationId: coverage_api_admin_coverage_get
      parameters:
      - in: query
        name: year_from
        required: false
        schema:
          default: 2018
          title: Year From
          type: integer
      - in: query
        name: year_to
        required: false
        schema:
          default: 2026
          title: Year To
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Coverage
  /api/admin/knowledge/links:
    post:
      operationId: link_api_admin_knowledge_links_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Link
  /api/admin/knowledge/links/{link_id}/review:
    post:
      operationId: review_link_api_admin_knowledge_links__link_id__review_post
      parameters:
      - in: path
        name: link_id
        required: true
        schema:
          title: Link Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Review Link
  /api/admin/knowledge/nodes:
    post:
      operationId: create_node_api_admin_knowledge_nodes_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Node
  /api/admin/knowledge/nodes/{node_id}/deprecate:
    post:
      operationId: deprecate_node_api_admin_knowledge_nodes__node_id__deprecate_post
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          title: Node Id
          type: string
      - in: query
        name: merged_into
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Merged Into
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Deprecate Node
  /api/admin/knowledge/nodes/{node_id}/questions:
    get:
      operationId: node_questions_api_admin_knowledge_nodes__node_id__questions_get
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          title: Node Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Node Questions
  /api/admin/knowledge/nodes/{node_id}/versions:
    post:
      operationId: revise_node_api_admin_knowledge_nodes__node_id__versions_post
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          title: Node Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeVersionIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revise Node
  /api/admin/questions:
    post:
      operationId: add_question_api_admin_questions_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionIn'
        required: true
      responses:
        '201':
