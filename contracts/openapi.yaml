components:
  schemas:
    AdminErrorDiagnosisOut:
      description: 管理端 AI 错因深度分析与三套可选解决方法。
      properties:
        admin_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Admin Note
        attempt_id:
          title: Attempt Id
          type: string
        cognitive_gap_type:
          enum:
          - concept_confusion
          - condition_omission
          - method_misuse
          - reasoning_break
          - calculation_slip
          title: Cognitive Gap Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        evidence_from_dialogue:
          title: Evidence From Dialogue
          type: string
        id:
          title: Id
          type: string
        model_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Used
        root_cause_summary:
          title: Root Cause Summary
          type: string
        selected_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Selected At
        selected_option_id:
          anyOf:
          - enum:
            - opt_1
            - opt_2
            - opt_3
            type: string
          - type: 'null'
          title: Selected Option Id
        solutions:
          items:
            $ref: '#/components/schemas/DiagnosisSolutionOptionOut'
          title: Solutions
          type: array
        tutor_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tutor Session Id
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - attempt_id
      - root_cause_summary
      - cognitive_gap_type
      - evidence_from_dialogue
      - solutions
      - created_at
      - updated_at
      title: AdminErrorDiagnosisOut
      type: object
    AdminReturnReflectionIn:
      description: 管理端退回学生重写复盘的理由载荷。
      properties:
        reason:
          default: 请进一步写明具体出错步骤与可执行的改进方法
          maxLength: 200
          minLength: 2
          title: Reason
          type: string
      title: AdminReturnReflectionIn
      type: object
    AdminSelectSolutionIn:
      description: 管理员选定其中一套解决对策并附加备注。
      properties:
        admin_note:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Admin Note
        option_id:
          enum:
          - opt_1
          - opt_2
          - opt_3
          title: Option Id
          type: string
      required:
      - option_id
      title: AdminSelectSolutionIn
      type: object
    AdminWrongDiagnosticDetailOut:
      description: 管理端错题详情：含参考答案、完整数据库引导对话回放与 AI 诊断报告。
      properties:
        attempt_id:
          title: Attempt Id
          type: string
        correct_answer:
          title: Correct Answer
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        diagnosis:
          anyOf:
          - $ref: '#/components/schemas/AdminErrorDiagnosisOut'
          - type: 'null'
        earned_points:
          anyOf:
          - type: number
          - type: 'null'
          title: Earned Points
        kind:
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_codes:
          items:
            type: string
          title: Knowledge Codes
          type: array
        knowledge_titles:
          items:
            type: string
          title: Knowledge Titles
          type: array
        max_points:
          title: Max Points
          type: number
        options:
          items:
            type: string
          title: Options
          type: array
        question_version_id:
          title: Question Version Id
          type: string
        stem:
          title: Stem
          type: string
        student_answer:
          title: Student Answer
          type: string
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        tutor_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tutor Session Id
        tutor_turns:
          items:
            $ref: '#/components/schemas/TutorTurnOut'
          title: Tutor Turns
          type: array
      required:
      - attempt_id
      - question_version_id
      - subject
      - stem
      - kind
      - options
      - correct_answer
      - student_answer
      - max_points
      - knowledge_codes
      - knowledge_titles
      - created_at
      title: AdminWrongDiagnosticDetailOut
      type: object
    AdminWrongDiagnosticListItemOut:
      description: 管理端错题诊断工作台左侧列表项。
      properties:
        attempt_id:
          title: Attempt Id
          type: string
        cognitive_gap_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Cognitive Gap Type
        correct_answer:
          default: ''
          title: Correct Answer
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        earned_points:
          anyOf:
          - type: number
          - type: 'null'
          title: Earned Points
        has_diagnosis:
          default: false
          title: Has Diagnosis
          type: boolean
        kind:
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_codes:
          items:
            type: string
          title: Knowledge Codes
          type: array
        knowledge_titles:
          items:
            type: string
          title: Knowledge Titles
          type: array
        max_points:
          title: Max Points
          type: number
        options:
          items:
            type: string
          title: Options
          type: array
        question_version_id:
          title: Question Version Id
          type: string
        selected_option_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Selected Option Id
        selected_solution_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Selected Solution Title
        stem_excerpt:
          title: Stem Excerpt
          type: string
        student_answer:
          title: Student Answer
          type: string
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        tutor_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tutor Session Id
        tutor_turn_count:
          default: 0
          title: Tutor Turn Count
          type: integer
      required:
      - attempt_id
      - question_version_id
      - subject
      - stem_excerpt
      - kind
      - student_answer
      - max_points
      - knowledge_codes
      - knowledge_titles
      - created_at
      title: AdminWrongDiagnosticListItemOut
      type: object
    AdoptedSolutionOut:
      description: 管理端已采纳的改进方案（Level 2 透出给学生端的精简对策视图）。
      properties:
        action_steps:
          items:
            type: string
          title: Action Steps
          type: array
        admin_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Admin Note
        approach_focus:
          title: Approach Focus
          type: string
        option_id:
          title: Option Id
          type: string
        selected_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Selected At
        title:
          title: Title
          type: string
      required:
      - option_id
      - title
      - approach_focus
      - action_steps
      title: AdoptedSolutionOut
      type: object
    AttachmentOut:
      properties:
        byte_size:
          exclusiveMinimum: 0.0
          title: Byte Size
          type: integer
        confirmed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Confirmed At
        created_at:
          format: date-time
          title: Created At
          type: string
        extracted_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Extracted Text
        filename:
          title: Filename
          type: string
        id:
          title: Id
          type: string
        media_type:
          enum:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - image/png
          - image/jpeg
          - audio/mpeg
          - audio/mp4
          title: Media Type
          type: string
        parsed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Parsed At
        parser_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Parser Version
        question_version_ids:
          items:
            type: string
          title: Question Version Ids
          type: array
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        source_document_id:
          title: Source Document Id
          type: string
        status:
          enum:
          - uploaded
          - parsed
          - needs_manual_input
          - confirmed
          title: Status
          type: string
      required:
      - id
      - source_document_id
      - filename
      - media_type
      - sha256
      - byte_size
      - status
      - extracted_text
      - parser_version
      - parsed_at
      - confirmed_at
      - created_at
      - question_version_ids
      title: AttachmentOut
      type: object
    AttemptIn:
      properties:
        answer:
          title: Answer
          type: string
        client_attempt_id:
          maxLength: 128
          minLength: 1
          title: Client Attempt Id
          type: string
        exposure_id:
          title: Exposure Id
          type: string
        hints_used:
          default: false
          title: Hints Used
          type: boolean
      required:
      - client_attempt_id
      - exposure_id
      - answer
      title: AttemptIn
      type: object
    BatchNodeReviewIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchNodeReviewItem'
          maxItems: 200
          minItems: 1
          title: Items
          type: array
      required:
      - items
      title: BatchNodeReviewIn
      type: object
    BatchNodeReviewItem:
      properties:
        node_id:
          minLength: 1
          title: Node Id
          type: string
        review_opinion:
          minLength: 1
          title: Review Opinion
          type: string
        review_status:
          enum:
          - approved
          - rejected
          title: Review Status
          type: string
        reviewer_id:
          maxLength: 40
          minLength: 1
          title: Reviewer Id
          type: string
      required:
      - node_id
      - reviewer_id
      - review_status
      - review_opinion
      title: BatchNodeReviewItem
      type: object
    DiagnosisSolutionOptionOut:
      description: AI 为管理员提供的单个可选解决对策。
      properties:
        action_steps:
          items:
            type: string
          title: Action Steps
          type: array
        approach_focus:
          title: Approach Focus
          type: string
        option_id:
          enum:
          - opt_1
          - opt_2
          - opt_3
          title: Option Id
          type: string
        rationale:
          title: Rationale
          type: string
        title:
          title: Title
          type: string
      required:
      - option_id
      - title
      - approach_focus
      - rationale
      - action_steps
      title: DiagnosisSolutionOptionOut
      type: object
    DomainRadarItemOut:
      description: 一级知识领域掌握度聚合统计（供成长状态雷达/条形展示）。
      properties:
        domain_code:
          title: Domain Code
          type: string
        domain_name:
          title: Domain Name
          type: string
        insufficient_count:
          title: Insufficient Count
          type: integer
        mastered_count:
          title: Mastered Count
          type: integer
        observed_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Observed Rate
        tested_topics:
          title: Tested Topics
          type: integer
        total_topics:
          title: Total Topics
          type: integer
        untested_count:
          title: Untested Count
          type: integer
        weak_count:
          title: Weak Count
          type: integer
      required:
      - domain_code
      - domain_name
      - total_topics
      - tested_topics
      - mastered_count
      - weak_count
      - insufficient_count
      - untested_count
      title: DomainRadarItemOut
      type: object
    DraftKnowledgeCandidate:
      description: 系统或视觉模型给出的候选知识点及简述理由，供家长核对选择。
      properties:
        knowledge_id:
          maxLength: 100
          minLength: 1
          title: Knowledge Id
          type: string
        reason:
          default: ''
          maxLength: 300
          title: Reason
          type: string
        title:
          maxLength: 160
          minLength: 1
          title: Title
          type: string
      required:
      - knowledge_id
      - title
      title: DraftKnowledgeCandidate
      type: object
    ErratumIn:
      properties:
        note:
          minLength: 1
          title: Note
          type: string
      required:
      - note
      title: ErratumIn
      type: object
    ExternalSchoolItemIn:
      description: 外部平台（如 k12100.com）抓取的逐题原始得分与错题摘要。
      properties:
        earned_points:
          minimum: 0.0
          title: Earned Points
          type: number
        error_category:
          anyOf:
          - enum:
            - concept
            - calculation
            - reading
            - method
            - norm
            - other
            type: string
          - type: 'null'
          title: Error Category
        knowledge_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Knowledge Id
        max_points:
          exclusiveMinimum: 0.0
          maximum: 100.0
          title: Max Points
          type: number
        question_label:
          maxLength: 160
          minLength: 1
          title: Question Label
          type: string
        stem_text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Stem Text
        wrong_reason:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Wrong Reason
      required:
      - question_label
      - earned_points
      - max_points
      title: ExternalSchoolItemIn
      type: object
    GoalIn:
      properties:
        max_points:
          exclusiveMinimum: 0.0
          title: Max Points
          type: number
        minutes_per_day:
          maximum: 240.0
          minimum: 5.0
          title: Minutes Per Day
          type: integer
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        target_points:
          minimum: 0.0
          title: Target Points
          type: number
      required:
      - subject
      - target_points
      - max_points
      - minutes_per_day
      title: GoalIn
      type: object
    GrowthStatusOut:
      description: 学生成长状态总览：优势、薄弱、领域雷达与当前目标。
      properties:
        current_goal:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Current Goal
        developing:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Developing
          type: array
        disclaimer:
          title: Disclaimer
          type: string
        domain_radar:
          items:
            $ref: '#/components/schemas/DomainRadarItemOut'
          title: Domain Radar
          type: array
        model_version:
          title: Model Version
          type: string
        planning_threshold:
          title: Planning Threshold
          type: number
        recent_wrong_count:
          title: Recent Wrong Count
          type: integer
        release_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Version
        strengths:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Strengths
          type: array
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        summary_counts:
          additionalProperties:
            type: integer
          title: Summary Counts
          type: object
        untested_highlights:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Untested Highlights
          type: array
        weaknesses:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Weaknesses
          type: array
      required:
      - subject
      - model_version
      - planning_threshold
      - summary_counts
      - strengths
      - weaknesses
      - developing
      - untested_highlights
      - domain_radar
      - recent_wrong_count
      - disclaimer
      title: GrowthStatusOut
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HistoricalWrongQuestionSummaryOut:
      description: 历史近期错题回顾卡片信息（已作答历史错题展示错答与正确答案对照）。
      properties:
        adopted_solution:
          anyOf:
          - $ref: '#/components/schemas/AdoptedSolutionOut'
          - type: 'null'
        attempt_id:
          title: Attempt Id
          type: string
        correct_answer:
          title: Correct Answer
          type: string
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        earned_points:
          anyOf:
          - type: number
          - type: 'null'
          title: Earned Points
        kind:
          enum:
          - single_choice
          - short_answer
          - subjective
          title: Kind
          type: string
        knowledge_codes:
          items:
            type: string
          title: Knowledge Codes
          type: array
        knowledge_titles:
          items:
            type: string
          title: Knowledge Titles
          type: array
        max_points:
          title: Max Points
          type: number
        options:
          items:
            type: string
          title: Options
          type: array
        question_version_id:
          title: Question Version Id
          type: string
        selection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Selection Reason
        stem:
          title: Stem
          type: string
        student_answer:
          title: Student Answer
          type: string
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        tutor_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tutor Session Id
      required:
      - attempt_id
      - question_version_id
      - subject
      - stem
      - kind
      - options
      - student_answer
      - max_points
      - knowledge_codes
      - knowledge_titles
      - correct_answer
      title: HistoricalWrongQuestionSummaryOut
      type: object
    ImportConfirmationIn:
      properties:
        confirmed_by_human:
          description: 必须为 true，表示人工核对结构化题目
          title: Confirmed By Human
          type: boolean
        questions:
          items:
            $ref: '#/components/schemas/QuestionIn'
          maxItems: 100
          minItems: 1
          title: Questions
          type: array
      required:
      - confirmed_by_human
      - questions
      title: ImportConfirmationIn
      type: object
    K12100ReportJobStartIn:
      description: 启动宿主机 k12100「总分」分析报告自动下载与考试档案同步任务。
      properties:
        headless:
          default: false
          title: Headless
          type: boolean
        max_exams:
          default: 3
          maximum: 3.0
          minimum: 1.0
          title: Max Exams
          type: integer
      title: K12100ReportJobStartIn
      type: object
    K12100SyncJobStartIn:
      description: 手动发起宿主机 k12100.com 全科采集补全任务的请求参数。
      properties:
        confirm_total_scores:
          default: false
          title: Confirm Total Scores
          type: boolean
        exam_keyword:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Exam Keyword
        extract_existing_pdfs:
          default: true
          title: Extract Existing Pdfs
          type: boolean
        headless:
          default: true
          title: Headless
          type: boolean
        max_exams:
          default: 1
          maximum: 3.0
          minimum: 1.0
          title: Max Exams
          type: integer
        replace_unconfirmed_drafts:
          default: true
          title: Replace Unconfirmed Drafts
          type: boolean
        series_title_prefix:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Series Title Prefix
        target_exam_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Target Exam Date
        upload_missing_cards:
          default: true
          title: Upload Missing Cards
          type: boolean
        use_ai:
          default: true
          title: Use Ai
          type: boolean
      title: K12100SyncJobStartIn
      type: object
    KnowledgeEdgeOut:
      description: 知识图谱关系边（层级隶属或前置依赖）。
      properties:
        edge_type:
          enum:
          - hierarchy
          - prerequisite
          title: Edge Type
          type: string
        relation:
          title: Relation
          type: string
        source:
          title: Source
          type: string
        target:
          title: Target
          type: string
      required:
      - source
      - target
      - relation
      - edge_type
      title: KnowledgeEdgeOut
      type: object
    KnowledgeGraphOut:
      description: 学生端知识图谱：已发布非选学节点、关系边与掌握状态高亮。
      properties:
        edges:
          items:
            $ref: '#/components/schemas/KnowledgeEdgeOut'
          title: Edges
          type: array
        model_version:
          title: Model Version
          type: string
        nodes:
          items:
            $ref: '#/components/schemas/KnowledgeMasteryItemOut'
          title: Nodes
          type: array
        release_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Version
        subject:
          enum:
          - math
          - chinese
          - english
          - physics
          title: Subject
          type: string
        summary_counts:
          additionalProperties:
            type: integer
          title: Summary Counts
          type: object
      required:
      - subject
      - model_version
      - summary_counts
      - nodes
      - edges
      title: KnowledgeGraphOut
      type: object
    KnowledgeMasteryItemOut:
      description: 单个知识节点的掌握状态与统计信息。
      properties:
        code:
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
        is_leaf:
          title: Is Leaf
          type: boolean
        level:
          title: Level
          type: integer
        mastery_status:
          enum:
          - mastered
          - weak
          - insufficient
          - untested
          title: Mastery Status
          type: string
        name:
          title: Name
          type: string
        observed_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Observed Rate
        parent_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Code
        sample_size:
          title: Sample Size
          type: integer
      required:
      - code
      - name
      - level
      - is_leaf
      - sample_size
      - mastery_status
      title: KnowledgeMasteryItemOut
      type: object
    LinkIn:
      properties:
        evidence:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence
        node_id:
          title: Node Id
          type: string
        question_version_id:
          title: Question Version Id
          type: string
        role:
          default: core
          enum:
          - core
          - aux
          title: Role
          type: string
        sub_index:
          default: 0
          minimum: 0.0
          title: Sub Index
          type: integer
      required:
      - question_version_id
      - node_id
      title: LinkIn
      type: object
    NodeIn:
