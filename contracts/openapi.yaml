          - type: 'null'
          title: Expected Sha256
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/pdf:
            schema:
              format: binary
              type: string
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              format: binary
              type: string
          audio/mp4:
            schema:
              format: binary
              type: string
          audio/mpeg:
            schema:
              format: binary
              type: string
          image/jpeg:
            schema:
              format: binary
              type: string
          image/png:
            schema:
              format: binary
              type: string
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
