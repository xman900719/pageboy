[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shutong-api"
version = "0.1.0"
description = "ShuTong private learning app foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema[format]>=4.23,<5", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["shutong*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

